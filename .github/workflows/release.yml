name: Release Firmware

# Publishes karabas-pro-<tag>.zip, packed by scripts/package_release.sh from the
# binaries committed in firmware/releases/profi (they reach master via PRs).
#
# If the release for the tag already exists (e.g. created by hand), its title
# and notes are left alone; the zip is only added when it is not there yet.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag (e.g. v26102401-romain2A1b02)'
        required: true
      title:
        description: 'Release title for a new release (default: "Build <tag>")'
        required: false

jobs:
  release:
    name: Package & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine tag
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: echo "tag=${INPUT_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.vars.outputs.tag }}

      - name: Package bundle
        run: scripts/package_release.sh "${{ steps.vars.outputs.tag }}" .

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          TITLE: ${{ github.event.inputs.title }}
        run: |
          ZIP="karabas-pro-$TAG.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$ZIP"; then
              echo "Release $TAG already has $ZIP, nothing to do"
            else
              gh release upload "$TAG" "$ZIP"
            fi
          else
            gh release create "$TAG" "$ZIP" --verify-tag \
              --title "${TITLE:-Build $TAG}" --generate-notes
          fi
