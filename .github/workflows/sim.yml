name: GHDL simulation

# GHDL benches (firmware/src/fpga/profi/sim):
# - video controller -> OSD overlay -> scandoubler in all six screen modes,
#   compared with expected_scandoubler.txt;
# - avr.vhd RTC handling, audio_mixer against a model, tda1543 decoded;
# - memory.vhd in the +3e mode against the ZX Spectrum +3 memory map;
# - the frame INT of the video controller against the old one, with mutations.

# Manual only: Actions -> GHDL simulation -> Run workflow.
on:
  workflow_dispatch:

jobs:
  scandoubler:
    name: scandoubler (GHDL)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install GHDL
        run: sudo apt-get update -q && sudo apt-get install -y -q ghdl

      - name: Run the bench
        run: |
          ghdl --version | head -1
          firmware/src/fpga/profi/sim/run_scandoubler.sh "$RUNNER_TEMP/sim" | tee sim.log
          { echo '### Scandoubler timing (GHDL)'; echo '```'; grep -E '^(pentagon|classic|profi)' sim.log; echo '```'; tail -1 sim.log; } >> "$GITHUB_STEP_SUMMARY"

  avr-audio:
    name: avr RTC + audio (GHDL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install GHDL
        run: sudo apt-get update -q && sudo apt-get install -y -q ghdl

      - name: Run the benches
        run: |
          firmware/src/fpga/profi/sim/run_avr_audio.sh "$RUNNER_TEMP/sim" | tee sim.log
          { echo '### avr RTC + audio (GHDL)'; echo '```'; cat sim.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  plus3e:
    name: +3e memory map (GHDL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install GHDL
        run: sudo apt-get update -q && sudo apt-get install -y -q ghdl

      - name: Run the bench
        run: |
          firmware/src/fpga/profi/sim/run_plus3e.sh "$RUNNER_TEMP/sim" | tee sim.log
          { echo '### +3e memory map (GHDL)'; echo '```'; cat sim.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  frame-int:
    name: frame INT (GHDL)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install GHDL
        run: sudo apt-get update -q && sudo apt-get install -y -q ghdl

      - name: Run the bench
        run: |
          firmware/src/fpga/profi/sim/run_int.sh "$RUNNER_TEMP/sim" | tee sim.log
          { echo '### Frame INT (GHDL)'; echo '```'; cat sim.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
