; USB keyboard / mouse -> PS/2 bridge for Karabas-Pro on an RP2040 board (README.md).
; Build: pio run; flash: hold BOOTSEL, plug in, copy .pio/build/pico/firmware.uf2 to RPI-RP2.

[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
; Pico-PIO-USB needs 120 or 240 MHz
board_build.f_cpu = 120000000L
board_build.arduino.earlephilhower.usb_manufacturer = Karabas
board_build.arduino.earlephilhower.usb_product = Karabas-Pro PS2 bridge
build_flags = -D USE_TINYUSB -D CFG_TUH_RPI_PIO_USB=1
lib_deps = https://github.com/sekigon-gonnoc/Pico-PIO-USB.git#0.7.3
